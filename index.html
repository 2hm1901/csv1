<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quan ly thiet bi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="Cong cu quan ly du lieu">
        <div>
          <h1>Quan ly thiet bi</h1>
          <p>Upload CSV hoac nhap tay tung dong, gan PDF va hover vao Loai_thiet_bi de xem.</p>
        </div>
        <div class="toolbar-actions">
          <label class="file-button">
            <input id="csvInput" type="file" accept=".csv,text/csv" />
            Upload CSV
          </label>
          <button id="addRowButton" type="button">Them dong</button>
          <button id="clearButton" class="danger" type="button">Xoa du lieu</button>
        </div>
      </section>

      <div class="content-layout">
        <aside id="pdfPreview" class="pdf-preview" aria-hidden="true">
          <div class="preview-header">
            <strong id="previewTitle">PDF</strong>
            <span id="previewMeta"></span>
          </div>
          <iframe id="previewFrame" title="Xem truoc PDF"></iframe>
          <div id="previewFallback" class="preview-fallback">Dong nay chua gan file PDF.</div>
        </aside>

        <section class="panel" aria-label="Bang thiet bi">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>STT</th>
                  <th>Loai_thiet_bi</th>
                  <th>Ten nha san xuat</th>
                  <th>SL</th>
                  <th>Doi may (Model)</th>
                  <th>Cong suat</th>
                  <th>Don vi so huu</th>
                  <th>THOI HAN KIEM DINH</th>
                  <th>Bien_so</th>
                  <th>PDF</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state">
            Chua co du lieu. Hay upload CSV hoac them dong moi.
          </div>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
